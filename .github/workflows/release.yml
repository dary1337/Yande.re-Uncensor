name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate extension
        run: |
          node --check main.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"

      - name: Materialise signing key
        env:
          EXTENSION_KEY: ${{ secrets.EXTENSION_KEY }}
        run: printf '%s' "$EXTENSION_KEY" | base64 -d > key.pem

      - name: Build & sign
        env:
          EXTENSION_KEY_PATH: key.pem
        run: npm run build

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/yandere-uncencor.zip
            dist/yandere-uncencor.crx
          body: |
            Unlocks 18+ posts (`rating:e` / `extreme_content`) on Yande.re for guests — no login required.

            ## Install
            - **Userscript (easiest, any browser):** paste the script from the [README](https://github.com/dary1337/Yande.re-Uncensor#method-1--userscript-easiest) into Tampermonkey/Violentmonkey.
            - **Desktop (Chrome/Edge/Brave):** download `yandere-uncencor.zip`, unpack, then `chrome://extensions` → Developer mode → Load unpacked.
            - **Mobile (Kiwi):** download `yandere-uncencor.crx` and install it via Kiwi → Extensions.

            _Built and signed automatically by CI._
